[package]
name = "folks-consumer"
version = "0.1.0"
edition = "2024"
publish = false

# Renamed dependency and no direct serde/serde_with/garde dependency: proves the
# generated code only needs the (renamed) runtime crate.
[dependencies]
my_folks = { package = "folks", path = "../folks" }

[dev-dependencies]
# Only for the `axum_valid` test: proves the generated types work with the
# garde extractors of the web ecosystem.
axum = { version = "0.8", default-features = false, features = ["json"] }
axum-valid = { version = "0.25", default-features = false, features = [
    "garde",
    "json",
] }
tokio = { version = "1", features = ["macros", "rt"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

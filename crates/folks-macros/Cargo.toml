[package]
name = "folks-macros"
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.91.1"

[lib]
proc-macro = true

[features]
schemars = []
utoipa = []
email = []
url = []
pattern = ["dep:regex-syntax"]

[dependencies]
regex-syntax = { version = "0.8", optional = true }
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = "2"

[package]
name = "folks"
version = "0.2.3"
edition = "2024"
license = "MIT"
rust-version = "1.91.1"

[features]
default = []
# Opt-in per entity with `#[entity(schemars)]` / `#[entity(utoipa)]`.
schemars = ["dep:schemars", "folks-macros/schemars"]
utoipa = ["dep:utoipa", "folks-macros/utoipa"]
# Extra `validate(..)` rules (each needs its garde feature and the macro flag).
email = ["garde/email", "folks-macros/email"]
url = ["garde/url", "folks-macros/url"]
pattern = ["garde/pattern", "dep:regex", "folks-macros/pattern"]

[dependencies]
schemars = { version = "1.2.3", optional = true }
utoipa = { version = "6.0.0", optional = true }
garde = { version = "0.23.0", default-features = false }
regex = { version = "1.13.1", optional = true }
folks-macros = { path = "../folks-macros" }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
thiserror = "2.0.21"
convert_case = "0.12.0"

[dev-dependencies]
serde_json = "1.0.154"
trybuild = "1.0.122"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
